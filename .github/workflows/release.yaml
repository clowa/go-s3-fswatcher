name: Release

on:
  push:
    tags:
      - "v*" # Triggers on tags starting with "v"

env:
  REGISTRY: ghcr.io # GitHub Container Registry

jobs:
  release:
    name: Run GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to checkout the repository and create releases
      packages: write # Required to publish to GitHub Packages + Container Registry

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clone

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set up Go environment
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23

      # Set up QEMU required by buildx
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v4.2.0
        id: run-goreleaser
        with:
          version: "~> v2.8"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner}}
          REPO: ${{ github.event.repository.name }}
